<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        const t = localStorage.getItem("app-theme") || "dark";
        document.documentElement.classList.add(t);
      })();
    </script>
    <link rel="icon" href="/web/icon-192-maskable.png" sizes="any" />
    <link rel="apple-touch-icon" href="/web/icon-192.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"
    />

    <meta
      name="keywords"
      content="vexai, artificial intelligence, website, ai, javascript, typescript, machine learning, chatbot, your own ai, github, cookieukw, vex"
    />

    <meta
      property="og:description"
      content="The purpose of VexAI is to create an artificial intelligence capable of holding normal conversations and discussing games and various interesting subjects and who knows, maybe even becoming a conscious AI (⊙_⊙)."
    />
    <meta property="og:image" content="/web/icon-192.png" />
    <meta property="og:url" content="https://vex-ai.netlify.app/enUS" />
    <meta property="og:type" content="website" />
    <title>Vex, your virtual friend</title>
    <style>
      html {
        background-color: black;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <style>
        .vex-initial-loader {
          position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background-color: #0d0d0d; color: #fff;
        }
        .vex-spinner {
          width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.1); border-top-color: #10b981; border-radius: 50%; animation: vex-spin 1s linear infinite;
        }
        @keyframes vex-spin { to { transform: rotate(360deg); } }
      </style>
      <div class="vex-initial-loader">
        <div class="vex-spinner"></div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>

    <script>
      if (
        window.location.hostname === "localhost" &&
        window.location.port === "5173"
      ) {
        eruda.init();
      }
    </script>

    <script type="module" src="/app/main.tsx"></script>
  </body>
</html>
